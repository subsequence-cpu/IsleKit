name: Native macOS checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  native:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build Xcode project
        shell: bash
        run: |
          set -o pipefail
          xcodebuild -project IsleKit.xcodeproj -scheme IsleKit -configuration Debug \
            -destination 'platform=macOS' CODE_SIGN_IDENTITY=- build 2>&1 | xcbeautify --renderer github-actions
      - run: SIGN_IDENTITY=- make app
